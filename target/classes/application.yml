# ============================================================
# EasyChat 应用配置（YAML）
# 注意：YAML 用空格缩进（每层 2 个），不要用 Tab！
# ============================================================

server:
  # HTTP 业务端口
  port: 5050
  servlet:
    # 所有接口统一前缀 /api
    context-path: /api
    session:
      # session 过期时间 60 分钟
      timeout: 60m

# WebSocket（Netty）独立端口，P6 才真正生效
ws:
  port: 5051

spring:
  servlet:
    multipart:
      # 上传大小限制（P7 会讲为什么这两个值在原项目里实际不生效）
      max-file-size: 15MB
      max-request-size: 15MB
  web:
    resources:
      # 关闭静态资源映射，所有请求都走 Controller
      add-mappings: false

  datasource:
    # URL 里含 & ? %2B，用双引号包起来最稳
    url: "jdbc:mysql://127.0.0.1:3306/easychat_rebuild?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false"
    username: root
    password: scx2006717
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    # 你本机 Redis 有密码，必须配置（原项目 properties 里没有这一行）
    password: scx2006717
    # 超时时间（毫秒）
    timeout: 2000
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0

# 项目根目录：日志、上传文件、App 安装包都放这里
project:
  folder: "c:/easychat/"

# 日志级别（logback-spring.xml 里用 springProperty 读取）
log:
  root:
    level: debug

# 超级管理员邮箱（多个用逗号分隔）
admin:
  emails: test@qq.com
